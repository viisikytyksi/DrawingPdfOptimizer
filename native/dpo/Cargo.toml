[package]
name = "dpo"
version = "0.9.0"
description = "DrawingPdfOptimizer native engine (Rust)"
license = "MIT"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
encoding_rs = "0.8"
fax = "0.3.0"
flate2 = "1.1.10"
image = "0.25.10"
lopdf = "0.45.0"
mozjpeg = { version = "0.10.13", optional = true }
rayon = "1.12.0"
zune-jpeg = "0.5.15"

[features]
mozjpeg = ["dep:mozjpeg"]
